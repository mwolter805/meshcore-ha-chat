# Quality scale tracker for meshcore-ha-chat.
# This integration ships via HACS only and is not currently seeking
# Home Assistant core inclusion. The file documents progress against
# HA's published Integration Quality Scale rules
# (https://developers.home-assistant.io/docs/core/integration-quality-scale/checklist)
# so contributors have a clear "what's done, what's exempt, what's
# pending" view.

rules:
  # ─── Bronze ──────────────────────────────────────────────────────────
  action-setup:
    status: exempt
    comment: Integration registers no service actions; uses WebSocket commands instead.
  appropriate-polling:
    status: exempt
    comment: Event-driven (consumes meshcore_message events from upstream); no polling.
  brands:
    status: done
    comment: brand/icon.png and brand/icon@2x.png present.
  common-modules:
    status: done
    comment: utils.py and unread_tracking.py provide cross-handler shared helpers.
  config-flow-test-coverage:
    status: done
    comment: tests/components/meshcore_chat/test_config_flow.py covers the single-step flow and the single-instance abort.
  config-flow:
    status: done
    comment: |
      Single-step user flow with two preconditions (meshcore installed,
      single instance). OptionsFlow exposes retention tunables.
      data_description present in strings.json/translations/en.json.
  dependency-transparency:
    status: done
    comment: |
      manifest.json declares its dependencies (runtime requirements is
      empty); README's Requirements section documents the meshcore>=2.6.0
      floor.
  docs-actions:
    status: exempt
    comment: No service actions registered.
  docs-high-level-description:
    status: done
    comment: README opens with a one-paragraph integration description.
  docs-installation-instructions:
    status: done
    comment: README Installation section covers both HACS and manual paths.
  docs-removal-instructions:
    status: done
    comment: README "## Removal" documents config-entry deletion and optional message-archive cleanup.
  entity-event-setup:
    status: exempt
    comment: Integration creates no entities.
  entity-unique-id:
    status: exempt
    comment: Integration creates no entities.
  has-entity-name:
    status: exempt
    comment: Integration creates no entities.
  runtime-data:
    status: done
    comment: Per-entry state lives on entry.runtime_data via the MeshCoreChatRuntimeData dataclass (__init__.py); process-global state stays on hass.data[DOMAIN].
  test-before-configure:
    status: exempt
    comment: Single-step flow; nothing to "test" pre-configure.
  test-before-setup:
    status: done
    comment: |
      ConfigEntryNotReady is raised in async_setup_entry when the upstream
      meshcore integration has no active coordinators; HA retries setup
      when the dependency becomes ready.
  unique-config-entry:
    status: done
    comment: |
      config_flow.py async_step_user aborts with single_instance_allowed
      if a meshcore_chat entry already exists.

  # ─── Silver ──────────────────────────────────────────────────────────
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading:
    status: done
    comment: async_unload_entry implemented; per-entry teardown clean.
  docs-configuration-parameters:
    status: done
    comment: Retention tunables (days, max messages) are documented in README "## Known limitations" and INSTRUCTIONS "Adjusting message retention".
  docs-installation-parameters:
    status: done
    comment: Single-step config flow; INSTRUCTIONS.md covers what little there is.
  entity-unavailable:
    status: exempt
    comment: No entities.
  integration-owner:
    status: done
    comment: codeowners ["@mwolter805"] in manifest.json.
  log-when-unavailable:
    status: done
    comment: |
      ConfigEntryNotReady covers the unavailable-upstream case at setup, and
      a repair issue (UpstreamMeshcoreUnavailableRepairFlow, created via
      ir.async_create_issue) surfaces the runtime case.
  parallel-updates:
    status: exempt
    comment: No platforms.
  reauthentication-flow:
    status: exempt
    comment: No authentication.
  test-coverage:
    status: done
    comment: |
      pytest suite under tests/components/meshcore_chat/ covers config-flow,
      setup/unload (test_init.py), the WebSocket API (test_ws_api.py, ~150
      cases), message store, unread tracking, and channel scopes.

  # ─── Gold ────────────────────────────────────────────────────────────
  devices:
    status: exempt
    comment: Integration creates no devices; consumes upstream's.
  diagnostics:
    status: done
    comment: diagnostics.py implements async_get_config_entry_diagnostics with entity-id redaction.
  discovery-update-info:
    status: exempt
    comment: No discovery surface.
  discovery:
    status: exempt
    comment: No discovery (meshcore upstream owns radio discovery).
  docs-data-update:
    status: done
    comment: README intro and "Relationship to other projects" describe the event-driven model (consumes meshcore_message events; no polling).
  docs-examples:
    status: done
    comment: README "## Use cases" and INSTRUCTIONS "## Common tasks" provide worked examples.
  docs-known-limitations:
    status: done
    comment: README "## Known limitations".
  docs-supported-devices:
    status: exempt
    comment: Integration is hardware-agnostic (whatever upstream meshcore supports).
  docs-supported-functions:
    status: done
    comment: README Features + Screenshots and INSTRUCTIONS per-tab walkthrough document the panel's functions.
  docs-troubleshooting:
    status: done
    comment: README "## Tips & Troubleshooting" plus the INSTRUCTIONS troubleshooting section.
  docs-use-cases:
    status: done
    comment: README "## Use cases".
  dynamic-devices:
    status: exempt
    comment: No devices.
  entity-category:
    status: exempt
    comment: No entities.
  entity-device-class:
    status: exempt
    comment: No entities.
  entity-disabled-by-default:
    status: exempt
    comment: No entities.
  entity-translations:
    status: exempt
    comment: No entities.
  exception-translations:
    status: done
    comment: |
      User-facing WS errors resolve through translation keys; strings.json
      and translations/en.json carry an "exceptions" block, surfaced via
      _ws_send_error_safe / _t.
  icon-translations:
    status: exempt
    comment: No entities.
  reconfiguration-flow:
    status: partial
    comment: OptionsFlow handles runtime tunables. No separate reconfigure flow because there's nothing to reconfigure beyond the retention options.
  repair-issues:
    status: done
    comment: repairs.py (UpstreamMeshcoreUnavailableRepairFlow) with ir.async_create_issue call sites in __init__.py and ws_api.py.
  stale-devices:
    status: exempt
    comment: No devices.

  # ─── Platinum ────────────────────────────────────────────────────────
  async-dependency:
    status: exempt
    comment: No runtime Python dependencies (manifest requirements is empty).
  inject-websession:
    status: exempt
    comment: No runtime Python dependencies; no HTTP client to inject a websession into.
  strict-typing:
    status: todo
    comment: |
      Integration uses type hints and `from __future__ import annotations`
      throughout, but has no `mypy --strict` configuration or `py.typed`
      marker. This is the one remaining open quality-scale item.
