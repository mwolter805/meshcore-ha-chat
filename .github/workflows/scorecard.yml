name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 00:00 UTC.
    - cron: "0 0 * * 1"
  push:
    branches: [main]

# Minimal top-level permissions; the analysis job escalates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Skip on non-canonical repos (e.g. the private dev mirror); the public
    # badge and OIDC publish only make sense on the canonical public repo.
    if: github.repository == 'mwolter805/meshcore-ha-chat'
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed for the OIDC token used by publish_results.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API so the README badge resolves.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: results.sarif
