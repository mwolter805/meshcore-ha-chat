name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    # Weekly, Monday 00:00 UTC.
    - cron: "0 0 * * 1"
  push:
    branches: [main]

# Minimal top-level permissions; the analysis job escalates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Skip on non-canonical repos (e.g. the private dev mirror); the public
    # badge and OIDC publish only make sense on the canonical public repo.
    if: github.repository == 'mwolter805/meshcore-ha-chat'
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed for the OIDC token used by publish_results.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the OpenSSF REST API so the README badge resolves.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
